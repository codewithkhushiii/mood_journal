<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibely — Sign In</title>
<meta name="description" content="Sign in to Vibely — your personal mood journal and emotional wellness companion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF3E6;
  --paper:#FFFFFF;
  --ink:#413B33;
  --ink-soft:#8B8375;
  --coral:#F3AF95;
  --coral-deep:#EA8A66;
  --peach:#FBDFCF;
  --yellow:#F6D785;
  --yellow-deep:#EFC55B;
  --green:#A9CDAE;
  --green-deep:#7DAE84;
  --line:#EEE4D4;
  --shadow: 0 10px 30px -12px rgba(120,95,60,0.18);
  --shadow-lg: 0 20px 60px -15px rgba(120,95,60,0.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
h1,h2,h3{font-family:'Baloo 2',sans-serif;}

/* Background blobs */
.bg-blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;animation:float 20s ease-in-out infinite;}
.blob-1{width:400px;height:400px;background:var(--coral);top:-100px;left:-80px;animation-delay:0s;}
.blob-2{width:350px;height:350px;background:var(--yellow);bottom:-80px;right:-60px;animation-delay:-7s;}
.blob-3{width:280px;height:280px;background:var(--green);top:50%;left:60%;animation-delay:-14s;}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(30px,-30px) scale(1.05);}
  66%{transform:translate(-20px,20px) scale(0.95);}
}

/* Container */
.auth-container{
  position:relative;z-index:1;
  width:100%;max-width:440px;padding:20px;
}

/* Card */
.auth-card{
  background:var(--paper);
  border-radius:28px;
  box-shadow:var(--shadow-lg);
  padding:40px 36px 36px;
  position:relative;
  overflow:hidden;
}
.auth-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--coral-deep),var(--yellow-deep),var(--green-deep));
}

/* Brand */
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;justify-content:center;}
.auth-brand-mark{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(145deg,var(--coral),var(--coral-deep));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 4px 14px -4px rgba(234,138,102,.4);
}
.auth-brand-name{font-family:'Baloo 2';font-weight:800;font-size:26px;color:var(--ink);}

/* Tabs */
.auth-tabs{display:flex;gap:4px;background:var(--cream);border-radius:14px;padding:4px;margin-bottom:26px;}
.auth-tab{
  flex:1;padding:10px;border-radius:11px;font-weight:800;font-size:14px;
  text-align:center;cursor:pointer;transition:.25s;color:var(--ink-soft);
  border:none;background:none;font-family:inherit;
}
.auth-tab.active{background:var(--paper);color:var(--coral-deep);box-shadow:0 2px 8px rgba(120,95,60,.1);}

/* Forms */
.auth-form{display:none;}
.auth-form.active{display:block;animation:fadeSlide .35s ease;}
@keyframes fadeSlide{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

.form-group{margin-bottom:18px;}
.form-label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--ink-soft);}
.form-input{
  width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--line);
  font-family:inherit;font-size:14.5px;color:var(--ink);transition:.2s;
  background:var(--cream);outline:none;
}
.form-input:focus{border-color:var(--coral-deep);background:var(--paper);}
.form-input::placeholder{color:#c4b8a4;}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Error message */
.form-error{
  background:#FEF0F0;color:#D35050;padding:10px 14px;border-radius:12px;
  font-size:13px;font-weight:700;margin-bottom:16px;display:none;
  border:1px solid #FADEDE;
}
.form-error.show{display:flex;align-items:center;gap:8px;animation:shake .4s ease;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}

/* Submit button */
.auth-btn{
  width:100%;padding:14px;border-radius:14px;border:none;
  background:linear-gradient(135deg,var(--coral-deep),#E07D54);
  color:#fff;font-family:'Baloo 2';font-weight:800;font-size:16px;
  cursor:pointer;transition:.2s;position:relative;overflow:hidden;
  box-shadow:0 6px 20px -6px rgba(234,138,102,.45);
}
.auth-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px -6px rgba(234,138,102,.55);}
.auth-btn:active{transform:translateY(0);}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.auth-btn .spinner{
  display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;
  margin:0 auto;
}
.auth-btn.loading .btn-text{display:none;}
.auth-btn.loading .spinner{display:block;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Divider */
.auth-divider{
  display:flex;align-items:center;gap:14px;margin:20px 0;
  color:var(--ink-soft);font-size:12px;font-weight:700;
}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--line);}

/* Footer text */
.auth-footer{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:22px;}
.auth-footer a{color:var(--coral-deep);font-weight:800;cursor:pointer;text-decoration:none;}

/* Success overlay */
.success-overlay{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;
  background:rgba(251,243,230,.9);backdrop-filter:blur(10px);
}
.success-overlay.show{display:flex;}
.success-content{text-align:center;animation:popIn .5s cubic-bezier(.175,.885,.32,1.275);}
.success-emoji{font-size:64px;margin-bottom:16px;animation:bounce 1s ease infinite;}
.success-content h2{font-size:24px;margin-bottom:8px;}
.success-content p{color:var(--ink-soft);font-size:15px;}
@keyframes popIn{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

/* Mobile */
@media(max-width:480px){
  .auth-card{padding:30px 24px 28px;border-radius:22px;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-mark">🌤️</div>
      <span class="auth-brand-name">Vibely</span>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- Error display -->
    <div class="form-error" id="authError">
      <span>❌</span>
      <span id="authErrorText"></span>
    </div>

    <!-- LOGIN FORM -->
    <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="auth-btn" id="loginBtn">
        <span class="btn-text">Sign In →</span>
        <div class="spinner"></div>
      </button>
      <div class="auth-footer">
        Don't have an account? <a onclick="switchTab('register')">Create one</a>
      </div>
    </form>

    <!-- REGISTER FORM -->
    <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" type="text" id="regUsername" placeholder="vibemaster" required minlength="3" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Display Name</label>
          <input class="form-input" type="text" id="regDisplayName" placeholder="Your Name" autocomplete="name">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="regEmail" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password <span style="font-weight:500;color:#c4b8a4;">(min 6 characters)</span></label>
        <input class="form-input" type="password" id="regPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="auth-btn" id="registerBtn">
        <span class="btn-text">Create Account ✨</span>
        <div class="spinner"></div>
      </button>
      <div class="auth-footer">
        Already have an account? <a onclick="switchTab('login')">Sign in</a>
      </div>
    </form>
  </div>
</div>

<!-- Success Overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="success-content">
    <div class="success-emoji">🎉</div>
    <h2>Welcome to Vibely!</h2>
    <p>Your account is ready. Redirecting...</p>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

  if (tab === 'login') {
    document.getElementById('tabLogin').classList.add('active');
    document.getElementById('loginForm').classList.add('active');
  } else {
    document.getElementById('tabRegister').classList.add('active');
    document.getElementById('registerForm').classList.add('active');
  }
  hideError();
}

function showError(msg) {
  const el = document.getElementById('authError');
  document.getElementById('authErrorText').textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('authError').classList.remove('show');
}

function setLoading(btn, loading) {
  if (loading) {
    btn.classList.add('loading');
    btn.disabled = true;
  } else {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

async function handleLogin(e) {
  e.preventDefault();
  hideError();
  const btn = document.getElementById('loginBtn');
  setLoading(btn, true);

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginPassword').value,
      })
    });

    const data = await res.json();
    if (!res.ok) {
      showError(data.detail || 'Login failed');
      return;
    }

    // Redirect to dashboard
    window.location.href = '/';
  } catch (err) {
    showError('Connection error. Please try again.');
  } finally {
    setLoading(btn, false);
  }
}

async function handleRegister(e) {
  e.preventDefault();
  hideError();
  const btn = document.getElementById('registerBtn');
  setLoading(btn, true);

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('regUsername').value.trim(),
        display_name: document.getElementById('regDisplayName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
      })
    });

    const data = await res.json();
    if (!res.ok) {
      showError(data.detail || 'Registration failed');
      return;
    }

    // Show success overlay
    document.getElementById('successOverlay').classList.add('show');
    setTimeout(() => {
      window.location.href = '/';
    }, 1800);
  } catch (err) {
    showError('Connection error. Please try again.');
  } finally {
    setLoading(btn, false);
  }
}
</script>
</body>
</html>
